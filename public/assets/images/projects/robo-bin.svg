<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0D1117" rx="12"/>
  <rect x="2" y="2" width="796" height="496" rx="10" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="2"/>
  <defs>
    <linearGradient id="roboGrad" x1="0" y1="0" x2="800" y2="500">
      <stop stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#09051F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roboGrad)" rx="12"/>

  <!-- Hardware / Robotics Graphic -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="300" height="340" rx="20" fill="#130B3A" stroke="#7C3AED" stroke-width="3"/>
    
    <!-- Smart Bin Ultrasonic & Microcontroller Graphic -->
    <circle cx="100" cy="80" r="30" fill="#2E1065" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="200" cy="80" r="30" fill="#2E1065" stroke="#A78BFA" stroke-width="3"/>
    <circle cx="100" cy="80" r="12" fill="#7C3AED"/>
    <circle cx="200" cy="80" r="12" fill="#7C3AED"/>
    
    <rect x="50" y="150" width="200" height="140" rx="10" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
    <text x="150" y="190" font-family="monospace" font-size="16" font-weight="bold" fill="#C4B5FD" text-anchor="middle">ROBO-BIN IoT</text>
    <text x="150" y="220" font-family="monospace" font-size="12" fill="#A78BFA" text-anchor="middle">STATUS: ACTIVE</text>
    <text x="150" y="250" font-family="monospace" font-size="11" fill="#34D399" text-anchor="middle">AUTONOMOUS SORTING</text>
  </g>
</svg>
