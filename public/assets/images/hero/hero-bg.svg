<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#0D0733"/>
  <!-- Geometric Grid & Glowing Purple Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0D0733" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D0733" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  <circle cx="960" cy="450" r="500" fill="url(#glow)"/>
  
  <!-- Circuit & Grid Lines -->
  <g stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>

    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  
  <!-- Subtle Circuit Nodes -->
  <circle cx="640" cy="360" r="5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="1280" cy="540" r="5" fill="#A78BFA" opacity="0.6"/>
  <circle cx="960" cy="720" r="5" fill="#A78BFA" opacity="0.6"/>
</svg>
